# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # Yash's target roles: Software Engineer, Backend Engineer, AI/ML Engineer, Founding Engineer
    # -- Software / Backend Engineering --
    - "Software Engineer"
    - "Software Developer"
    - "Backend Engineer"
    - "Backend Developer"
    - "Full Stack Engineer"
    - "Full-Stack Engineer"
    - "Fullstack Engineer"
    - "Full Stack Developer"
    - "Founding Engineer"
    # -- AI/ML roles --
    - "AI Engineer"
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "AI/ML"
    - "LLM"
    - "GenAI"
    - "Generative AI"
    - "RAG"
    - "NLP"
    - "MLOps"
    - "LLMOps"
    - "AI Platform"
    - "Applied AI"
    # -- Adjacent / stretch roles --
    - "Platform Engineer"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Infrastructure Engineer"
  negative:
    - "Staff"
    - "Principal"
    - "Lead "
    - "Manager"
    - "Director"
    - "VP "
    - "Vice President"
    - ".NET"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    - "New Grad"
    - "Junior"
    - "Mid"
    - "Senior"

# -- Search queries --
# US-only job boards. Queries target Yash's roles: Software Engineer,
# Backend Engineer, Full Stack Engineer, AI/ML Engineer, Founding Engineer.

search_queries:
  # -- Ashby --
  - name: Ashby — Software & Backend Engineer
    query: 'site:jobs.ashbyhq.com "Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer" OR "Fullstack Engineer"'
    enabled: true

  - name: Ashby — AI/ML & Founding Engineer
    query: 'site:jobs.ashbyhq.com "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" OR "Founding Engineer" OR "LLM Engineer"'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Software & Backend Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer"'
    enabled: true

  - name: Greenhouse — AI/ML & Founding Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" OR "Founding Engineer"'
    enabled: true

  # -- Lever --
  - name: Lever — Software & Backend Engineer
    query: 'site:jobs.lever.co "Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer" OR "Fullstack Engineer"'
    enabled: true

  - name: Lever — AI/ML & Founding Engineer
    query: 'site:jobs.lever.co "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" OR "Founding Engineer" OR "LLM Engineer"'
    enabled: true

  # -- Wellfound (startups) --
  - name: Wellfound — Software & AI Engineer
    query: 'site:wellfound.com "Software Engineer" OR "Backend Engineer" OR "AI Engineer" OR "ML Engineer" OR "Founding Engineer"'
    enabled: true

  # -- Workable --
  - name: Workable — Software & AI Engineer
    query: 'site:apply.workable.com "Software Engineer" OR "Backend Engineer" OR "AI Engineer" OR "ML Engineer" OR "Founding Engineer"'
    enabled: true

  # -- YC Jobs --
  - name: YC Jobs — Software & Founding Engineer
    query: 'site:workatastartup.com "Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer" OR "Founding Engineer"'
    enabled: true

  - name: YC Jobs — AI/ML Engineer
    query: 'site:workatastartup.com "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" OR "LLM Engineer"'
    enabled: true

  # -- HN Who's Hiring --
  - name: HN Who's Hiring — AI/SWE
    query: 'site:news.ycombinator.com "AI Engineer" OR "Software Engineer" OR "Backend Engineer" OR "Founding Engineer" OR "ML Engineer"'
    enabled: true

